<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¡Gracias! | MAASTAC</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(135deg,#0ea5e9 0%,#7c3aed 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#111}
    .card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:40px 32px;max-width:680px;width:92%}
    h1{margin:0 0 10px;font-size:28px;line-height:1.15}
    p{margin:8px 0;color:#444}
    .btn{display:inline-flex;align-items:center;gap:10px;margin-top:18px;background:#0ea5e9;color:#fff;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:800}
    .btn.secondary{background:#6b7280}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:2px solid #bfdbfe;background:linear-gradient(90deg,#eff6ff,#f5f3ff);color:#1d4ed8;font-weight:800;margin-bottom:12px}
    .muted{color:#6b7280;font-size:12px;margin-top:12px}
  </style>
  <!-- GA4 y Meta Pixel se cargan más abajo SOLO si el visitante los autorizó (preferencia "maastac_consent",
       la misma que guarda el banner de la web). Sin consentimiento: ninguna petición a Google ni a Meta. -->
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="badge" id="ty-badge">¡Gracias por tu interés!</div>
    <h1 id="ty-title">Gracias por contactar con MAASTAC</h1>
    <p id="ty-body">Puedes volver al inicio para conocer nuestros servicios.</p>
    <p id="ty-extra"></p>

    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a class="btn" href="/">← Volver al inicio</a>
      <a class="btn secondary" id="cta-lead-ai" href="/#lead-ai" style="display:none">Conocer Lead AI</a>
      <a class="btn secondary" id="cta-servicios" href="/#servicios" style="display:none">Ver servicios</a>
    </div>

    <p class="muted">MAASTAC · Web · Automatización · Integraciones</p>
  </main>

  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const rawSrc = (qs.get('src') || '').toLowerCase();
      // Soportar ambos: ?src=magnet y ?src=leadmagnet
      const src = rawSrc === 'leadmagnet' ? 'magnet' : rawSrc;

      // ── Consentimiento: misma clave y estructura que src/consent/consent.ts ──
      function readConsent() {
        try {
          const c = JSON.parse(localStorage.getItem('maastac_consent') || 'null');
          if (c && c.version === 1 && typeof c.analytics === 'boolean' && typeof c.marketing === 'boolean') return c;
        } catch (e) {}
        return null; // sin decisión válida = nada autorizado
      }
      function loadScript(url) {
        const s = document.createElement('script');
        s.async = true;
        s.src = url;
        document.head.appendChild(s);
      }
      const consent = readConsent();

      // ── Conversión de un solo uso: misma clave, formato y TTL que src/utils/leadConversion.ts ──
      // Contact.tsx guarda la marca solo tras un envío correcto a Formspree. Se BORRA aquí antes de enviar
      // nada: refresh, Atrás/Adelante, visita directa o URL copiada en otra pestaña => sin conversión.
      function consumeLead(expectedSrc) {
        let raw = null;
        try {
          raw = sessionStorage.getItem('maastac_lead_pending');
          sessionStorage.removeItem('maastac_lead_pending');
        } catch (e) { return null; }
        try {
          const p = JSON.parse(raw || 'null');
          const age = p && typeof p.ts === 'number' ? Date.now() - p.ts : -1;
          if (p && typeof p.id === 'string' && p.src === expectedSrc && age >= 0 && age < 30 * 60 * 1000) return p;
        } catch (e) {}
        return null;
      }
      const lead = consumeLead(src);

      // GA4: SOLO con consentimiento analítico
      if (consent && consent.analytics === true) {
        try {
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          gtag('consent', 'default', { analytics_storage: 'granted', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
          gtag('js', new Date());
          gtag('config', 'G-YN77ENMF5B', { page_title: 'Gracias', allow_google_signals: false, allow_ad_personalization_signals: false });
          gtag('event', 'thank_you_view', { source: src || 'unknown' });
          const map = {
            magnet:    { event: 'download', value: 75 },
            // Sin valor monetario: no asignamos un valor ficticio a un lead hasta tener datos comerciales reales.
            contact:   { event: 'generate_lead' }
          };
          if (lead && map[src]) gtag('event', map[src].event, map[src].value ? { value: map[src].value, currency: 'USD' } : {});
          loadScript('https://www.googletagmanager.com/gtag/js?id=G-YN77ENMF5B');
        } catch (e) {}
      }

      // Meta Pixel: SOLO con consentimiento de marketing
      if (consent && consent.marketing === true) {
        try {
          const n = window.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
          if (!window._fbq) window._fbq = n;
          n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
          fbq('consent', 'grant');
          fbq('init', '1419230625849117');
          fbq('track', 'PageView');
          const pmap = {
            magnet:    { event: 'CompleteRegistration', value: 75 },
            contact:   { event: 'Lead' } // sin valor monetario (ver nota en GA4)
          };
          if (lead && pmap[src]) fbq('track', pmap[src].event, pmap[src].value ? { value: pmap[src].value, currency: 'USD' } : {}, { eventID: lead.id });
          loadScript('https://connect.facebook.net/en_US/fbevents.js');
        } catch (e) {}
      }

      // Personalización de mensajes y CTAs
      const $badge = document.getElementById('ty-badge');
      const $title = document.getElementById('ty-title');
      const $body  = document.getElementById('ty-body');
      const $extra = document.getElementById('ty-extra');
      const $ctaLeadAi = document.getElementById('cta-lead-ai');
      const $ctaServicios = document.getElementById('cta-servicios');

      // Mensajes: describir solo lo que realmente ocurre (no afirmar envíos de email ni confirmaciones).
      if (src === 'contact') {
        $badge.textContent = '✅ Solicitud recibida';
        $title.textContent = '¡Gracias por tu solicitud!';
        $body.textContent  = 'Hemos recibido tus datos. Revisaremos tu solicitud y nos pondremos en contacto contigo para coordinar la evaluación.';
        $extra.textContent = 'Mientras tanto, puedes conocer Lead AI, nuestra solución para captar y calificar leads.';
        $ctaLeadAi.style.display = 'inline-flex';
      } else if (src === 'magnet') {
        // Compatibilidad con enlaces antiguos de la sección Recursos (retirada de la landing).
        $badge.textContent = '⬇️ Descarga';
        $title.textContent = '¡Gracias por tu interés!';
        $body.textContent  = 'La descarga debería haberse abierto en una nueva pestaña.';
        $extra.textContent = '';
        $ctaServicios.style.display = 'inline-flex';
      } else {
        $ctaServicios.style.display = 'inline-flex';
      }
    })();
  </script>
</body>
</html>
